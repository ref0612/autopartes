<!doctype html>
<html lang="es">
<head>

<title>Autopartes · Kupos Portals</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="icon-btn" id="toggleSidebar" title="Colapsar menú" aria-label="Colapsar menú">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="icon-btn" title="Pantalla completa" aria-label="Pantalla completa">

      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="cartDrawer"></div>

<div class="modal" id="modalRoot">
  <div class="modal-card" id="modalCard"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
